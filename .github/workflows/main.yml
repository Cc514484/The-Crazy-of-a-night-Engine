name: Build Android Only

on:
  workflow_dispatch:

jobs:
  BuildAndroid:
    name: Build Android
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Libraries & Setup Mobile
        run: |
          sh ./setup/mobile.sh

      - name: Configure Lime Android Settings
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Lime Android
        run: yes | haxelib run lime setup android

      - name: Build APK
        run: haxelib run lime build android -final

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: P-Slice-Android-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
